[package]
name = "mytimeoff-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Loopback hook endpoint and turn state driver for MyTimeOff"

[lints]
workspace = true

# The crate keeps the name that says what it is; the binary takes the name a person types.
# "daemon" is our word for the thing that listens, and nobody installing this tool has any
# reason to learn it - they have an app and a command, and this is the command.
[[bin]]
name = "mytimeoff"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
mytimeoff-core = { path = "../core" }
mytimeoff-quiz = { path = "../quiz" }
mytimeoff-store = { path = "../store" }
rand = "0.10.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order, because `mytimeoff hooks install` writes back a file somebody else
# wrote. Without it every key in their ~/.claude/settings.json comes back alphabetised,
# which is a diff they did not ask for in a file they may well have in git.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
# Format-preserving TOML, because `~/.codex/config.toml` is somebody else's file: a
# round trip through an ordinary parser would come back without their comments in it.
toml_edit = "0.25.15"

# The credential store and the startup list, and only where there are ones.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_Registry",
] }

[dev-dependencies]
