[package]
name = "mytimeoff-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Loopback hook endpoint and turn state driver for MyTimeOff"

[dependencies]
axum = "0.8.9"
mytimeoff-core = { path = "../core" }
rand = "0.10.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

# The credential store and the startup list, and only where there are ones.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_Registry",
] }

[dev-dependencies]
