[package]
name = "mytimeoff-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The window that takes the screen, and the bridge that feeds it"

[build-dependencies]
tauri-build = "2"

[dependencies]
axum = "0.8.9"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
mytimeoff-daemon = { path = "../daemon" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream"] }
tauri = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
