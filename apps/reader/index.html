<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyTimeOff — Reader</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app">
      <section id="picker">
        <h1>MyTimeOff</h1>
        <p>Drop an EPUB or PDF here, or choose a file to start reading.</p>
        <input type="file" id="file" accept=".epub,.pdf" />
        <pre id="error" hidden></pre>
      </section>
      <section id="stage" hidden>
        <div id="viewer"></div>
        <footer id="status">
          <button id="prev" type="button" aria-label="Previous page">‹</button>
          <span id="progress">—</span>
          <button id="next" type="button" aria-label="Next page">›</button>
        </footer>
      </section>
      <!--
        The indicator and the thing that announces it, stacked bottom-right. The corner is
        pinned rather than the indicator, so the toast can sit below without leaving the
        screen: what grows is the top of the stack.
      -->
      <div id="corner">
        <aside id="indicator" hidden>
          <span id="indicator-text"></span>
          <button id="back" type="button">Back to the agent</button>
        </aside>
        <!--
          `output` rather than `div`: it carries role="status" on its own, so a screen
          reader announces this the moment it appears, which is the whole point of it.
        -->
        <output id="toast" hidden></output>
      </div>
      <section id="quiz" hidden>
        <h2>Before you go</h2>
        <p id="quiz-note"></p>
        <form id="quiz-questions"></form>
        <footer id="quiz-actions">
          <button id="quiz-submit" type="button" hidden>Submit answers</button>
          <!-- Shown only where the mode allows it, which the daemon decides, not this. -->
          <button id="quiz-skip" type="button" hidden>Skip</button>
        </footer>
      </section>
      <span id="link" data-connected="false" title="daemon unreachable"></span>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
